services:
  postgres:
    image: postgres:18-alpine
    container_name: hotlap-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: hotlap
      POSTGRES_PASSWORD: hotlap_dev_password
      POSTGRES_DB: hotlap

    ports:
      - "5432:5432"

    volumes:
      - hotlap-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hotlap -d hotlap",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  hotlap-postgres-data:
    name: hotlap-postgres-data